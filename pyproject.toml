[project]
name = "isnad-graph"
version = "0.1.0"
description = "Annotated graph of recorded hadith chains of narration (asanid)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT (code); derived data CC-BY-4.0, see README" }
dependencies = ["pandas>=2.2", "pyarrow>=15", "networkx>=3.2", "scipy>=1.11"]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6.100", "ruff>=0.5"]

[project.scripts]
isnad-graph = "isnad_graph.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# vizops is math-vizops' figure core, vendored byte-for-byte and pinned in
# vendored.toml; it installs under its own name from vendor/python.
packages = ["src/isnad_graph", "vendor/python/vizops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "vendor/python"]
markers = ["source: requires the downloaded source database (skipped otherwise)"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["vendor"]  # vendored bytes are upstream's; never reformatted here

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Arabic text is intentional
